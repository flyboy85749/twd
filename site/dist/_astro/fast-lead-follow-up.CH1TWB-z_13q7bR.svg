<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- turquoise wall, a phone showing an instant reply, and a stopwatch -->
  <rect width="1200" height="630" fill="#137a7f"/>
  <rect y="590" width="1200" height="40" fill="#0d5c60"/>
  <g transform="translate(-90 0)">
  <!-- phone -->
  <rect x="430" y="70" width="290" height="540" rx="38" fill="#1b2a33"/>
  <rect x="448" y="104" width="254" height="472" rx="20" fill="#fafaf7"/>
  <rect x="540" y="84" width="70" height="10" rx="5" fill="#3d4f5a"/>
  <!-- incoming lead -->
  <rect x="468" y="150" width="180" height="78" rx="16" fill="#d9d6cf"/>
  <rect x="488" y="172" width="130" height="10" rx="5" fill="#8a949b"/>
  <rect x="488" y="196" width="96" height="10" rx="5" fill="#8a949b"/>
  <!-- instant reply -->
  <rect x="510" y="256" width="172" height="108" rx="16" fill="#137a7f"/>
  <rect x="530" y="278" width="128" height="10" rx="5" fill="#bfe0e1"/>
  <rect x="530" y="302" width="110" height="10" rx="5" fill="#bfe0e1"/>
  <rect x="530" y="326" width="70" height="10" rx="5" fill="#bfe0e1"/>
  <!-- booking button in the reply thread -->
  <path d="M532 404 a44 44 0 0 1 88 0 v40 h-88 z" fill="#d9a441"/>
  <path d="M556 424 l14 14 l26 -28" fill="none" stroke="#1b2a33" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- stopwatch -->
  <g transform="translate(830 300)">
    <rect x="-22" y="-176" width="44" height="34" rx="8" fill="#d9a441"/>
    <rect x="70" y="-150" width="30" height="20" rx="6" fill="#d9a441" transform="rotate(40 85 -140)"/>
    <circle r="150" fill="#fafaf7" stroke="#d9a441" stroke-width="18"/>
    <path d="M0 0 L0 -130 A130 130 0 0 1 64 -113 Z" fill="#e8b4a8"/>
    <g stroke="#1b2a33" stroke-width="6" stroke-linecap="round">
      <path d="M0 -128 v20"/><path d="M128 0 h-20"/><path d="M0 128 v-20"/><path d="M-128 0 h20"/>
    </g>
    <path d="M0 0 L60 -104" stroke="#1b2a33" stroke-width="10" stroke-linecap="round"/>
    <circle r="14" fill="#1b2a33"/>
  </g>
</svg>
