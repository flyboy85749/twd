<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- top-down street grid in ochre tones, a turquoise map pin, and a five-star review card -->
  <rect width="1200" height="630" fill="#efd29a"/>
  <g fill="#e2bb6d">
    <rect x="0" y="0" width="230" height="170"/><rect x="290" y="0" width="260" height="170"/>
    <rect x="610" y="0" width="300" height="170"/><rect x="970" y="0" width="230" height="170"/>
    <rect x="0" y="230" width="230" height="170"/><rect x="290" y="230" width="260" height="170"/>
    <rect x="970" y="230" width="230" height="170"/>
    <rect x="0" y="460" width="230" height="170"/><rect x="290" y="460" width="260" height="170"/>
    <rect x="610" y="460" width="300" height="170"/><rect x="970" y="460" width="230" height="170"/>
  </g>
  <!-- a park block -->
  <rect x="610" y="230" width="300" height="170" fill="#9fb38a"/>
  <circle cx="680" cy="290" r="26" fill="#3f6b4a"/><circle cx="760" cy="330" r="30" fill="#3f6b4a"/><circle cx="850" cy="280" r="22" fill="#3f6b4a"/>
  <!-- pin shadow and pin -->
  <ellipse cx="580" cy="408" rx="58" ry="16" fill="#1b2a33" opacity=".22"/>
  <path d="M580 404 C 530 330, 470 280, 470 210 a110 110 0 0 1 220 0 C 690 280, 630 330, 580 404 Z" fill="#137a7f"/>
  <circle cx="580" cy="210" r="46" fill="#fafaf7"/>
  <circle cx="580" cy="210" r="20" fill="#e8b4a8"/>
  <!-- review card -->
  <rect x="380" y="470" width="400" height="96" rx="12" fill="#1b2a33"/>
  <g fill="#d9a441">
    <path id="s" d="M0 -28 L8 -9 L28 -9 L12 3 L18 23 L0 11 L-18 23 L-12 3 L-28 -9 L-8 -9 Z" transform="translate(436 520)"/>
    <use href="#s" x="72"/><use href="#s" x="144"/><use href="#s" x="216"/><use href="#s" x="288"/>
  </g>
</svg>
