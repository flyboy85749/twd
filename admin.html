<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Tucson Web Development</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/blog.css" />
    <!-- Quill RTE -->
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="grid">
        <div class="col-1-1">
          <div class="content">
            <a href="index.html"
              ><img src="images/twd_logo.png" class="logo" alt="logo"
            /></a>
            <nav class="navigation">
              <a href="index.html">Home</a> · <a href="blog.html">Blog</a>
            </nav>
          </div>
        </div>
      </div>
    </header>

    <main class="wrap admin-wrap">
      <div class="grid grid-pad">
        <h1>Admin - Create Post</h1>
        <p>
          If your site is running the server API, enter the admin token below
          (set TWD_ADMIN_TOKEN on the server). Leave blank to use localStorage
          fallback.
        </p>
        <label>Admin Token (server)</label>
        <input type="text" id="admin-token" placeholder="server admin token" />
        <form id="post-form">
          <label>Title</label>
          <input type="text" id="post-title" required />

          <label>Date</label>
          <input type="date" id="post-date" />

          <label>Excerpt</label>
          <input type="text" id="post-excerpt" />

          <label>Content (rich text)</label>
          <!-- Quill editor container -->
          <div id="editor" style="background: #fff; height: 220px"></div>
          <!-- Hidden textarea fallback / storage field -->
          <textarea id="post-content" rows="8" style="display: none"></textarea>

          <label>Image URL (optional)</label>
          <input type="text" id="post-image" />

          <div class="form-actions">
            <button type="submit" class="btn">Create Post</button>
            <button id="clear-posts" type="button" class="btn btn-ghost">
              Clear All Posts
            </button>
          </div>
        </form>

        <hr />
        <h2>Existing Posts</h2>
        <div id="admin-posts"></div>
      </div>
    </main>

    <script src="js/jquery.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
